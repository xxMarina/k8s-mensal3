server {
    listen 80;
    server_name localhost;

    # Suporte para Single Page Application (Angular)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para o backend Marmitech API dentro do cluster Kubernetes
    # O uso do resolver + variável evita que o Nginx falhe na inicialização caso a API ainda não esteja pronta
    location /backend/ {
        resolver 10.96.0.10 valid=10s ipv6=off;
        set $backend_upstream http://marmitech-api.default.svc.cluster.local:8080;
        rewrite ^/backend/(.*) /$1 break;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
